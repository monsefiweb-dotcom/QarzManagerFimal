name: Extract Final QarzManager

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Final Project
        run: |
          mkdir -p /tmp/qarz
          unzip -o QarzManager_Final_Complete.zip -d /tmp/qarz

          ROOT=$(find /tmp/qarz -name settings.gradle -type f | head -1 | xargs dirname)

          echo "Project root: $ROOT"

          cp -r "$ROOT"/. ./

          rm -f QarzManager_Final_Complete.zip

      - name: Commit Project
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -A
          git commit -m "Update QarzManager Final Complete"
          git push
